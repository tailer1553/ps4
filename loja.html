<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja Gamer — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@1/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#fdf9fb; --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --accent:#bd3193; --accent-soft:rgba(189,49,147,.14);
    --accent2:#0891b2; --accent2-soft:rgba(8,145,178,.14);
    --border:rgba(15,23,42,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Bricolage Grotesque',system-ui,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(253,249,251,.85); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1200px; margin:0 auto; padding:.8rem 1.2rem;
    display:flex; align-items:center; gap:.8rem;
  }
  .logo{display:flex; align-items:center; gap:.55rem; font-weight:800; font-size:1.15rem; letter-spacing:-.02em; white-space:nowrap}
  .logo-mark{
    width:36px;height:36px;border-radius:10px; flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#fff;
  }
  .search-wrap{flex:1; position:relative; max-width:480px}
  .search-wrap svg{position:absolute; left:.75rem; top:50%; transform:translateY(-50%); color:var(--muted); width:18px;height:18px}
  #search{
    width:100%; padding:.6rem .9rem .6rem 2.4rem;
    border:1px solid var(--border); border-radius:999px; background:var(--card);
    font-size:.95rem; outline:none; transition:border-color .2s, box-shadow .2s;
  }
  #search:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .cart-btn{
    position:relative; flex:none; display:flex; align-items:center; gap:.4rem;
    padding:.55rem 1rem; border-radius:999px; font-weight:600; font-size:.92rem;
    background:var(--accent-soft); color:var(--text); border:1px solid var(--accent);
    transition:transform .15s;
  }
  .cart-btn:active{transform:scale(.96)}
  .cart-badge{
    position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; padding:0 5px;
    border-radius:999px; background:var(--accent); color:#fff; font-size:.72rem; font-weight:700;
    display:grid; place-items:center; border:2px solid var(--bg);
  }

  /* ---------- HERO ---------- */
  .hero{max-width:1200px; margin:0 auto; padding:2.4rem 1.2rem 1rem; text-align:center}
  .hero h1{font-size:clamp(1.8rem,5vw,2.8rem); font-weight:800; letter-spacing:-.03em; line-height:1.1}
  .grad-text{background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .hero p{margin-top:.6rem; color:var(--muted); font-size:1.05rem; max-width:560px; margin-left:auto; margin-right:auto}

  /* ---------- TOOLBAR (categorias + contador + ordenar) ---------- */
  .toolbar{max-width:1200px; margin:0 auto; padding:1rem 1.2rem .4rem}
  .chips{display:flex; gap:.5rem; overflow-x:auto; padding-bottom:.5rem; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; padding:.45rem 1rem; border-radius:999px; font-size:.88rem; font-weight:600;
    background:var(--card); border:1px solid var(--border); color:var(--muted);
    transition:all .2s; white-space:nowrap;
  }
  .chip.active{background:var(--text); color:#fff; border-color:var(--text)}
  .chip:hover:not(.active){border-color:var(--accent); color:var(--accent)}
  .meta-row{display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-top:.6rem; flex-wrap:wrap}
  .count-pill{font-size:.88rem; color:var(--muted); font-weight:500}
  .count-pill b{color:var(--accent); font-weight:700}
  #sort{
    padding:.4rem .7rem; border-radius:10px; border:1px solid var(--border);
    background:var(--card); font-size:.85rem; color:var(--text); outline:none;
  }

  /* ---------- GRID DE PRODUTOS ---------- */
  .grid{
    max-width:1200px; margin:0 auto; padding:1rem 1.2rem 3rem;
    display:grid; gap:1.1rem;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;
    display:flex; flex-direction:column; transition:transform .2s, box-shadow .2s;
  }
  .card:hover{transform:translateY(-4px); box-shadow:0 12px 30px rgba(15,23,42,.08)}
  .card-img{
    position:relative; aspect-ratio:3/4; width:100%; overflow:hidden;
    background:linear-gradient(135deg,var(--accent-soft),var(--accent2-soft));
    display:grid; place-items:center;
  }
  .card-img img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s}
  .card:hover .card-img img{transform:scale(1.05)}
  .card-img .fallback{font-size:3.2rem; font-weight:800; color:var(--accent); opacity:.5}
  .badge{
    position:absolute; top:.7rem; left:.7rem; z-index:2;
    padding:.25rem .65rem; border-radius:999px; font-size:.72rem; font-weight:700;
    background:var(--accent); color:#fff; letter-spacing:.02em;
  }
  .badge.alt{background:var(--accent2)}
  .card-body{padding:.9rem 1rem 1.1rem; display:flex; flex-direction:column; gap:.35rem; flex:1}
  .cat-tag{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent2)}
  .card-title{font-size:1rem; font-weight:700; line-height:1.25; min-height:2.5em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .card-desc{font-size:.82rem; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .price-row{margin-top:auto; padding-top:.6rem; display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap}
  .price{font-size:1.25rem; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums}
  .old-price{font-size:.85rem; color:var(--muted); text-decoration:line-through; font-variant-numeric:tabular-nums}
  .add-btn{
    margin-top:.7rem; width:100%; padding:.65rem; border-radius:12px; font-weight:700; font-size:.92rem;
    background:var(--text); color:#fff; display:flex; align-items:center; justify-content:center; gap:.45rem;
    transition:background .2s, transform .15s;
  }
  .add-btn:hover{background:var(--accent)}
  .add-btn:active{transform:scale(.97)}
  .add-btn svg{width:16px;height:16px}

  /* ---------- ESTADOS (carregando / erro / vazio) ---------- */
  .state-box{max-width:520px; margin:3rem auto; text-align:center; padding:2rem 1.5rem}
  .state-box .icon{width:48px;height:48px;margin:0 auto 1rem;color:var(--accent)}
  .state-box h3{font-size:1.2rem; margin-bottom:.4rem}
  .state-box p{color:var(--muted); font-size:.95rem; margin-bottom:1.2rem}
  .retry-btn{padding:.65rem 1.6rem; border-radius:999px; font-weight:700; background:var(--accent); color:#fff; font-size:.95rem}
  .skeleton{background:linear-gradient(90deg,var(--card) 25%, #f0eaf0 50%, var(--card) 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:12px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ---------- CARRINHO (drawer) ---------- */
  .overlay{position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:90; opacity:0; pointer-events:none; transition:opacity .25s}
  .overlay.open{opacity:1; pointer-events:auto}
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(400px,92vw); z-index:100;
    background:var(--card); border-left:1px solid var(--border);
    transform:translateX(105%); transition:transform .3s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column;
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{padding:1.1rem 1.2rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between}
  .drawer-head h3{font-size:1.1rem; font-weight:800; display:flex; align-items:center; gap:.5rem}
  .close-btn{width:34px;height:34px;border-radius:50%; display:grid;place-items:center; color:var(--muted)}
  .close-btn:hover{background:var(--bg); color:var(--text)}
  .drawer-items{flex:1; overflow-y:auto; padding:.8rem 1.2rem}
  .cart-item{display:flex; gap:.8rem; padding:.8rem 0; border-bottom:1px solid var(--border); align-items:center}
  .cart-item-thumb{width:52px;height:52px;border-radius:10px; flex:none; background:linear-gradient(135deg,var(--accent-soft),var(--accent2-soft)); display:grid;place-items:center; font-weight:800; color:var(--accent); overflow:hidden}
  .cart-item-thumb img{width:100%;height:100%;object-fit:cover}
  .cart-item-info{flex:1; min-width:0}
  .cart-item-title{font-size:.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cart-item-price{font-size:.85rem; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums}
  .qty-ctrl{display:flex; align-items:center; gap:.4rem; flex:none}
  .qty-btn{width:28px;height:28px;border-radius:8px; border:1px solid var(--border); display:grid;place-items:center; font-weight:700; color:var(--text)}
  .qty-btn:hover{border-color:var(--accent); color:var(--accent)}
  .qty-num{min-width:20px; text-align:center; font-weight:700; font-size:.9rem; font-variant-numeric:tabular-nums}
  .drawer-foot{padding:1.1rem 1.2rem; border-top:1px solid var(--border)}
  .total-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.9rem}
  .total-row span{color:var(--muted); font-weight:600}
  .total-row b{font-size:1.4rem; font-weight:800; font-variant-numeric:tabular-nums}
  .checkout-btn{
    width:100%; padding:.85rem; border-radius:14px; font-weight:800; font-size:1rem; color:#fff;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center; gap:.5rem; transition:opacity .2s, transform .15s;
  }
  .checkout-btn:hover{opacity:.92}
  .checkout-btn:active{transform:scale(.98)}
  .checkout-btn:disabled{opacity:.4; cursor:not-allowed}
  .empty-cart{text-align:center; padding:3rem 1rem; color:var(--muted)}
  .empty-cart svg{width:44px;height:44px;margin:0 auto .8rem; opacity:.5}

  /* ---------- FOOTER ---------- */
  footer{border-top:1px solid var(--border); background:var(--card)}
  .foot-inner{max-width:1200px; margin:0 auto; padding:1.8rem 1.2rem; display:flex; gap:1.5rem; flex-wrap:wrap; justify-content:space-between; align-items:center}
  .foot-inner .store-name{font-weight:800}
  .foot-inner .contact{display:flex; gap:1rem; flex-wrap:wrap; font-size:.9rem; color:var(--muted)}
  .foot-inner .contact a{color:var(--accent2); text-decoration:none; font-weight:600}
  .foot-note{max-width:1200px; margin:0 auto; padding:0 1.2rem 1.5rem; font-size:.78rem; color:var(--muted); text-align:center}

  @media (max-width:640px){
    .logo span.store-label{display:none}
    .hero{padding-top:1.6rem}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark"><i data-lucide="gamepad-2" style="width:20px;height:20px"></i></div>
      <span class="store-label" id="storeName">Loja Gamer</span>
    </div>
    <div class="search-wrap">
      <i data-lucide="search" style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)"></i>
      <input id="search" type="text" placeholder="Buscar produto..." autocomplete="off">
    </div>
    <button class="cart-btn" id="cartBtn" aria-label="Abrir carrinho">
      <i data-lucide="shopping-cart" style="width:18px;height:18px"></i>
      <span class="cart-badge" id="cartBadge" style="display:none">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <h1 id="heroTitle">Catálogo <span class="grad-text">atualizado</span></h1>
  <p id="heroTagline">Carregando produtos...</p>
</section>

<div class="toolbar">
  <div class="chips" id="chips"></div>
  <div class="meta-row">
    <div class="count-pill" id="countPill"></div>
    <select id="sort">
      <option value="default">Ordenar: padrão</option>
      <option value="price-asc">Menor preço</option>
      <option value="price-desc">Maior preço</option>
      <option value="name">Nome A–Z</option>
    </select>
  </div>
</div>

<main class="grid" id="grid"></main>

<!-- overlay + drawer do carrinho -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Carrinho de compras">
  <div class="drawer-head">
    <h3><i data-lucide="shopping-bag" style="width:20px;height:20px;color:var(--accent)"></i> Seu carrinho</h3>
    <button class="close-btn" id="closeCart" aria-label="Fechar carrinho"><i data-lucide="x" style="width:20px;height:20px"></i></button>
  </div>
  <div class="drawer-items" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Total</span><b id="cartTotal">R$ 0,00</b></div>
    <button class="checkout-btn" id="checkoutBtn" disabled>
      <i data-lucide="message-circle" style="width:20px;height:20px"></i> Finalizar no WhatsApp
    </button>
  </div>
</aside>

<footer>
  <div class="foot-inner">
    <div>
      <div class="store-name" id="footName">Loja Gamer</div>
      <div class="contact" id="footContact"></div>
    </div>
    <div style="color:var(--muted);font-size:.85rem">Catálogo carregado via JSON</div>
  </div>
  <div class="foot-note">Loja modelo para venda de produtos autorizados. Respeite os direitos autorais.</div>
</footer>

<script>
/* =====================================================================
   CONFIGURAÇÃO — ÚNICA LINHA PARA MUDAR O CATÁLOGO
   Troque o valor abaixo pelo link (URL) do seu arquivo JSON.
   Ele pode estar em qualquer hospedagem (GitHub Pages, Netlify, etc.).
   Dica: você também pode passar o link pela URL, ex:
         loja.html?json=GAMES.json
   ===================================================================== */
const JSON_URL = new URLSearchParams(location.search).get("json") || "catalogo.json";

(function(){
  "use strict";

  var state = { data:null, products:[], category:"Todos", query:"", sort:"default", cart:{} };
  var els = {};
  ["grid","chips","countPill","search","sort","cartBtn","cartBadge","drawer","overlay","closeCart","cartItems","cartTotal","checkoutBtn","storeName","footName","footContact","heroTitle","heroTagline"]
    .forEach(function(id){ els[id] = document.getElementById(id); });

  /* ---------- utilitários ---------- */
  function fmt(v, currency){
    v = Number(v) || 0;
    if(!currency || currency === "R$"){
      return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    }
    return currency + " " + v.toFixed(2).replace(".",",");
  }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function refreshIcons(){ if(window.lucide && lucide.createIcons) lucide.createIcons(); }

  /* ---------- carregar JSON ---------- */
  function showLoading(){
    els.grid.innerHTML = "";
    for(var i=0;i<8;i++){
      var c = el("div","card");
      var img = el("div","card-img"); img.classList.add("skeleton"); img.style.borderRadius="0";
      var body = el("div","card-body");
      var t1 = el("div","skeleton"); t1.style.height="14px"; t1.style.marginBottom=".4rem";
      var t2 = el("div","skeleton"); t2.style.height="12px"; t2.style.width="60%"; t2.style.marginBottom=".8rem";
      var t3 = el("div","skeleton"); t3.style.height="22px"; t3.style.width="45%";
      body.appendChild(t1); body.appendChild(t2); body.appendChild(t3);
      c.appendChild(img); c.appendChild(body);
      els.grid.appendChild(c);
    }
  }
  function showError(msg){
    els.grid.innerHTML = "";
    els.chips.innerHTML = "";
    var box = el("div","state-box");
    box.style.gridColumn="1/-1";
    var ic = document.createElement("div"); ic.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
    box.appendChild(ic);
    box.appendChild(el("h3",null,"Não foi possível carregar o catálogo"));
    box.appendChild(el("p",null, msg || "Verifique o link do arquivo JSON e se a hospedagem permite acesso (CORS)."));
    var btn = el("button","retry-btn","Tentar novamente");
    btn.addEventListener("click", load);
    box.appendChild(btn);
    els.grid.appendChild(box);
  }

  function load(){
    showLoading();
    fetch(JSON_URL, {cache:"no-store"})
      .then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(data){
        state.data = data || {};
        state.products = Array.isArray(data.products) ? data.products : [];
        applyStoreInfo(data.store || {});
        renderChips();
        render();
      })
      .catch(function(err){
        showError("Erro ao carregar: " + err.message);
      });
  }

  function applyStoreInfo(store){
    var name = store.name || "Loja Gamer";
    els.storeName.textContent = name;
    els.footName.textContent = name;
    document.title = name + " — Catálogo";
    if(store.tagline){ els.heroTagline.textContent = store.tagline; }
    else { els.heroTagline.textContent = "Confira nossos produtos e preços."; }
    // contato no rodapé
    els.footContact.innerHTML = "";
    if(store.whatsapp){
      var a = el("a"); a.href = "https://wa.me/" + String(store.whatsapp).replace(/\D/g,"");
      a.target = "_blank"; a.rel = "noopener";
      a.textContent = "WhatsApp: " + store.whatsapp;
      els.footContact.appendChild(a);
    }
    if(store.instagram){
      var b = el("a"); b.href = store.instagram; b.target="_blank"; b.rel="noopener";
      b.textContent = "Instagram";
      els.footContact.appendChild(b);
    }
    if(store.email){
      var c = el("a"); c.href = "mailto:" + store.email; c.textContent = store.email;
      els.footContact.appendChild(c);
    }
  }

  /* ---------- categorias ---------- */
  function renderChips(){
    els.chips.innerHTML = "";
    var cats = ["Todos"];
    if(Array.isArray(state.data.categories) && state.data.categories.length){
      state.data.categories.forEach(function(c){ if(cats.indexOf(c)===-1) cats.push(c); });
    }
    state.products.forEach(function(p){ if(p.category && cats.indexOf(p.category)===-1) cats.push(p.category); });
    cats.forEach(function(cat){
      var btn = el("button","chip" + (cat===state.category?" active":""), cat);
      btn.addEventListener("click", function(){ state.category = cat; renderChips(); render(); });
      els.chips.appendChild(btn);
    });
  }

  /* ---------- filtro + ordenação + render ---------- */
  function filtered(){
    var q = state.query.trim().toLowerCase();
    var list = state.products.filter(function(p){
      if(state.category !== "Todos" && p.category !== state.category) return false;
      if(!q) return true;
      return (p.title||"").toLowerCase().indexOf(q)>-1 ||
             (p.description||"").toLowerCase().indexOf(q)>-1 ||
             (p.category||"").toLowerCase().indexOf(q)>-1;
    });
    if(state.sort === "price-asc") list.sort(function(a,b){ return (Number(a.price)||0)-(Number(b.price)||0); });
    else if(state.sort === "price-desc") list.sort(function(a,b){ return (Number(b.price)||0)-(Number(a.price)||0); });
    else if(state.sort === "name") list.sort(function(a,b){ return String(a.title||"").localeCompare(String(b.title||""),"pt-BR"); });
    return list;
  }

  function render(){
    var list = filtered();
    var currency = (state.data.store && state.data.store.currency) || "R$";
    els.countPill.innerHTML = "";
    els.countPill.appendChild(document.createTextNode("Mostrando "));
    var b = el("b",null, list.length + (list.length===1?" produto":" produtos"));
    els.countPill.appendChild(b);

    els.grid.innerHTML = "";
    if(!list.length){
      var box = el("div","state-box"); box.style.gridColumn="1/-1";
      var ic = document.createElement("div"); ic.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
      box.appendChild(ic);
      box.appendChild(el("h3",null,"Nenhum produto encontrado"));
      box.appendChild(el("p",null,"Tente outra busca ou categoria."));
      els.grid.appendChild(box);
      return;
    }

    list.forEach(function(p){
      var card = el("article","card");

      var imgWrap = el("div","card-img");
      if(p.badge){
        var badge = el("span","badge" + (p.badgeType==="alt"?" alt":""), p.badge);
        imgWrap.appendChild(badge);
      }
      if(p.image){
        var img = document.createElement("img");
        img.alt = p.title || "Produto";
        img.loading = "lazy";
        img.src = p.image;
        img.addEventListener("error", function(){ this.style.display="none"; });
        imgWrap.appendChild(img);
      } else {
        var fb = el("div","fallback", (p.title||"?").trim().charAt(0).toUpperCase());
        imgWrap.appendChild(fb);
      }

      var body = el("div","card-body");
      if(p.category) body.appendChild(el("div","cat-tag", p.category));
      body.appendChild(el("h3","card-title", p.title || "Sem título"));
      if(p.description) body.appendChild(el("p","card-desc", p.description));

      var priceRow = el("div","price-row");
      priceRow.appendChild(el("span","price", fmt(p.price, currency)));
      if(p.oldPrice && Number(p.oldPrice) > Number(p.price||0)){
        priceRow.appendChild(el("span","old-price", fmt(p.oldPrice, currency)));
      }
      body.appendChild(priceRow);

      var addBtn = el("button","add-btn");
      addBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>';
      addBtn.appendChild(document.createTextNode(" Adicionar"));
      (function(prod){
        addBtn.addEventListener("click", function(){ addToCart(prod); });
      })(p);
      body.appendChild(addBtn);

      card.appendChild(imgWrap);
      card.appendChild(body);
      els.grid.appendChild(card);
    });
  }

  /* ---------- carrinho ---------- */
  function addToCart(p){
    var key = p.id || p.title;
    if(!state.cart[key]) state.cart[key] = { product:p, qty:0 };
    state.cart[key].qty++;
    syncCart();
    openCart();
  }
  function changeQty(key, delta){
    if(!state.cart[key]) return;
    state.cart[key].qty += delta;
    if(state.cart[key].qty <= 0) delete state.cart[key];
    syncCart();
  }
  function cartCount(){
    var n = 0;
    Object.keys(state.cart).forEach(function(k){ n += state.cart[k].qty; });
    return n;
  }
  function cartTotal(){
    var t = 0;
    Object.keys(state.cart).forEach(function(k){ t += (Number(state.cart[k].product.price)||0) * state.cart[k].qty; });
    return t;
  }
  function syncCart(){
    var n = cartCount();
    els.cartBadge.style.display = n ? "grid" : "none";
    els.cartBadge.textContent = n;
    var currency = (state.data.store && state.data.store.currency) || "R$";
    els.cartTotal.textContent = fmt(cartTotal(), currency);
    els.checkoutBtn.disabled = n === 0;

    els.cartItems.innerHTML = "";
    if(!n){
      var empty = el("div","empty-cart");
      empty.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>';
      empty.appendChild(el("p",null,"Seu carrinho está vazio."));
      els.cartItems.appendChild(empty);
      return;
    }
    Object.keys(state.cart).forEach(function(key){
      var item = state.cart[key], p = item.product;
      var row = el("div","cart-item");
      var thumb = el("div","cart-item-thumb");
      if(p.image){
        var im = document.createElement("img"); im.alt=""; im.src=p.image;
        im.addEventListener("error",function(){ this.style.display="none"; });
        thumb.appendChild(im);
      } else {
        thumb.textContent = (p.title||"?").trim().charAt(0).toUpperCase();
      }
      var info = el("div","cart-item-info");
      info.appendChild(el("div","cart-item-title", p.title||"Produto"));
      info.appendChild(el("div","cart-item-price", fmt(p.price, currency) + " cada"));
      var qty = el("div","qty-ctrl");
      var minus = el("button","qty-btn","−");
      var num = el("span","qty-num", item.qty);
      var plus = el("button","qty-btn","+");
      minus.addEventListener("click", function(){ changeQty(key,-1); });
      plus.addEventListener("click", function(){ changeQty(key, 1); });
      qty.appendChild(minus); qty.appendChild(num); qty.appendChild(plus);
      row.appendChild(thumb); row.appendChild(info); row.appendChild(qty);
      els.cartItems.appendChild(row);
    });
  }
  function openCart(){ els.drawer.classList.add("open"); els.overlay.classList.add("open"); }
  function closeCart(){ els.drawer.classList.remove("open"); els.overlay.classList.remove("open"); }

  els.cartBtn.addEventListener("click", openCart);
  els.closeCart.addEventListener("click", closeCart);
  els.overlay.addEventListener("click", closeCart);

  els.checkoutBtn.addEventListener("click", function(){
    var wa = (state.data.store && state.data.store.whatsapp) ? String(state.data.store.whatsapp).replace(/\D/g,"") : "";
    if(!wa){ alert("Cadastre o WhatsApp da loja no arquivo JSON (campo store.whatsapp)."); return; }
    var currency = (state.data.store && state.data.store.currency) || "R$";
    var lines = ["Olá! Quero fazer um pedido:"];
    Object.keys(state.cart).forEach(function(k){
      var it = state.cart[k];
      lines.push("• " + it.qty + "x " + (it.product.title||"Produto") + " — " + fmt(it.product.price, currency));
    });
    lines.push("");
    lines.push("Total: " + fmt(cartTotal(), currency));
    var url = "https://wa.me/" + wa + "?text=" + encodeURIComponent(lines.join("\n"));
    window.open(url, "_blank");
  });

  /* ---------- busca + ordenação ---------- */
  var searchTimer = null;
  els.search.addEventListener("input", function(){
    clearTimeout(searchTimer);
    var self = this;
    searchTimer = setTimeout(function(){ state.query = self.value; render(); }, 180);
  });
  els.sort.addEventListener("change", function(){ state.sort = this.value; render(); });

  /* ---------- iniciar ---------- */
  syncCart();
  load();
  refreshIcons();
})();
</script>
</body>
</html>
