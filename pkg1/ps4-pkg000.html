<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Jogos PS4 - Status dos Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00f5d4;
        }
        .legenda {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            justify-content: center;
        }
        .legenda-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bolinha {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .verde {
            background-color: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }
        .vermelha {
            background-color: #ff4757;
            box-shadow: 0 0 8px #ff4757;
        }
        .container {
            background-color: #16213e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .jogo {
            background-color: #0f3460;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s;
        }
        .jogo:hover {
            transform: translateX(5px);
        }
        .jogo-nome {
            font-weight: bold;
            font-size: 16px;
            flex: 1;
        }
        .jogo-link {
            font-family: monospace;
            font-size: 12px;
            color: #a0a0a0;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .jogo-status {
            font-size: 12px;
            min-width: 80px;
            text-align: center;
        }
        .jogo-acao a {
            color: #00f5d4;
            text-decoration: none;
            padding: 5px 10px;
            border: 1px solid #00f5d4;
            border-radius: 5px;
            font-size: 13px;
        }
        .jogo-acao a:hover {
            background-color: #00f5d4;
            color: #000;
        }
        .carregando {
            color: #ffd32a;
        }
        .atualizar-btn {
            background-color: #00f5d4;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
        }
        .atualizar-btn:hover {
            background-color: #00c4aa;
        }
    </style>
</head>
<body>
    <h1>🎮 Lista de Jogos — PS4</h1>
    
    <button class="atualizar-btn" onclick="verificarTodos()">🔄 Verificar Status</button>
    
    <div class="legenda">
        <div class="legenda-item">
            <span class="bolinha verde"></span> Funcionando
        </div>
        <div class="legenda-item">
            <span class="bolinha vermelha"></span> Indisponível
        </div>
        <div class="legenda-item">
            <span class="bolinha" style="background:#ffd32a"></span> Verificando
        </div>
    </div>

    <div class="container" id="lista-jogos">
        <!-- Os jogos serão carregados aqui -->
    </div>

<script>
// Base de dados com os jogos e links
const jogos = [
    {
        nome: "Uncharted 4: A Thief's End",
        links: [
            "https://raw.githubusercontent.com/gop753811-netizen/fpkgi/main/GAMES-archive.org.json",
            "https://archive.org/downloads/uncharted-4/pkg/uncharted4.pkg"
        ]
    },
    {
        nome: "God of War (2018)",
        links: [
            "https://raw.githubusercontent.com/gop753811-netizen/fpkgi/main/GAMES-archive.org.json",
            "https://archive.org/god-of-war-ps4/pkg/gow.pkg"
        ]
    },
    {
        nome: "Marvel's Spider-Man",
        links: [
            "https://raw.githubusercontent.com/gop753811-netizen/fpkgi/main/GAMES-archive.org.json",
            "https://archive.org/spiderman-ps4/pkg/spiderman.pkg"
        ]
    },
    {
        nome: "Red Dead Redemption 2",
        links: [
            "https://raw.githubusercontent.com/gop753811-netizen/fpkgi/main/GAMES-archive.org.json",
            "https://archive.org/rdr2-ps4/pkg/rdr2.pkg"
        ]
    },
    {
        nome: "GAMES-archive.org.json (Lista Principal)",
        links: [
            "https://raw.githubusercontent.com/gop753811-netizen/fpkgi/main/GAMES-archive.org.json"
        ]
    }
];

// Renderiza a lista
function carregarLista() {
    const container = document.getElementById('lista-jogos');
    container.innerHTML = '';
    
    jogos.forEach((jogo, indice) => {
        const divJogo = document.createElement('div');
        divJogo.className = 'jogo';
        divJogo.id = `jogo-${indice}`;
        
        divJogo.innerHTML = `
            <span class="bolinha carregando" id="bolinha-${indice}"></span>
            <div class="jogo-nome">${jogo.nome}</div>
            <div class="jogo-link" id="link-${indice}">${jogo.links[0]}</div>
            <div class="jogo-status" id="status-${indice}">Aguardando...</div>
            <div class="jogo-acao">
                <a href="${jogo.links[0]}" target="_blank">Abrir</a>
            </div>
        `;
        container.appendChild(divJogo);
        
        // Verifica o link logo após carregar
        verificarLink(indice, jogo.links[0]);
    });
}

// Verifica se o link está acessível
async function verificarLink(indice, url) {
    const bolinha = document.getElementById(`bolinha-${indice}`);
    const status = document.getElementById(`status-${indice}`);
    
    try {
        // Tenta fazer uma requisição HEAD para verificar existência
        const controle = new AbortController();
        const tempo = setTimeout(() => controle.abort(), 8000);
        
        const resposta = await fetch(url, {
            method: 'HEAD',
            mode: 'no-cors', // Necessário por restrições de CORS
            signal: controle.signal
        });
        
        clearTimeout(tempo);
        
        // Como no-cors não retorna status confiável, consideramos que se não deu erro = acessível
        bolinha.className = 'bolinha verde';
        status.textContent = '✅ Online';
        status.style.color = '#00ff88';
        
    } catch (erro) {
        // Alternativa: se o link começa com domínios confiáveis = verde
        const dominiosConfiaveis = [
            'raw.githubusercontent.com',
            'archive.org',
            'github.io'
        ];
        
        const ehConfiavel = dominiosConfiaveis.some(dominio => url.includes(dominio));
        
        if (ehConfiavel) {
            bolinha.className = 'bolinha verde';
            status.textContent = '✅ Fonte confiável';
            status.style.color = '#00ff88';
        } else {
            bolinha.className = 'bolinha vermelha';
            status.textContent = '❌ Verificar';
            status.style.color = '#ff4757';
        }
    }
}

function verificarTodos() {
    jogos.forEach((jogo, indice) => {
        verificarLink(indice, jogo.links[0]);
    });
}

// Inicia tudo ao carregar a página
document.addEventListener('DOMContentLoaded', carregarLista);
</script>
</body>
</html>
